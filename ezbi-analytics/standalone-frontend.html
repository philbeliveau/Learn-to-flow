<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZBI Analytics - Platform de Production</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.1); }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-all duration-200 transform hover:scale-105; }
        .card { @apply bg-white rounded-xl shadow-xl p-6 hover:shadow-2xl transition-shadow duration-300; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main App Component
        function EZBIApp() {
            const [currentView, setCurrentView] = useState('home');
            const [apiStatus, setApiStatus] = useState('checking');
            const [loginData, setLoginData] = useState({ email: '', password: '' });
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [user, setUser] = useState(null);
            const [kpis, setKpis] = useState(null);
            const [prediction, setPrediction] = useState(null);

            // Check API status on mount
            useEffect(() => {
                checkAPIStatus();
            }, []);

            const checkAPIStatus = async () => {
                try {
                    const response = await fetch('http://localhost:8003/health');
                    const data = await response.json();
                    setApiStatus(data.status === 'healthy' ? 'online' : 'offline');
                } catch (error) {
                    setApiStatus('offline');
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('http://localhost:8003/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginData)
                    });
                    const data = await response.json();
                    if (data.user) {
                        setUser(data.user);
                        setIsAuthenticated(true);
                        setCurrentView('dashboard');
                    }
                } catch (error) {
                    alert('Erreur de connexion: ' + error.message);
                }
            };

            const loadKPIs = async () => {
                try {
                    const response = await fetch('http://localhost:8003/api/v1/company/kpis');
                    const data = await response.json();
                    setKpis(data);
                } catch (error) {
                    console.error('Erreur KPIs:', error);
                }
            };

            const generatePrediction = async () => {
                try {
                    const response = await fetch('http://localhost:8003/api/v1/predictions/cashflow', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ revenue: 150000, expenses: 112500, period_days: 30 })
                    });
                    const data = await response.json();
                    setPrediction(data);
                } catch (error) {
                    console.error('Erreur prédiction:', error);
                }
            };

            // Status indicator
            const StatusIndicator = () => (
                <div className="flex items-center gap-2 mb-4">
                    <div className={`w-3 h-3 rounded-full ${apiStatus === 'online' ? 'bg-green-500' : apiStatus === 'offline' ? 'bg-red-500' : 'bg-yellow-500 animate-pulse'}`}></div>
                    <span className="text-sm font-medium">
                        API: {apiStatus === 'online' ? 'En ligne' : apiStatus === 'offline' ? 'Hors ligne' : 'Vérification...'}
                    </span>
                </div>
            );

            // Home Page
            if (currentView === 'home') {
                return (
                    <div className="min-h-screen gradient-bg">
                        <div className="container mx-auto px-4 py-8">
                            <StatusIndicator />
                            
                            <div className="max-w-6xl mx-auto">
                                {/* Header */}
                                <div className="text-center mb-12">
                                    <h1 className="text-6xl font-bold text-white mb-4">
                                        🏭 EZBI Analytics
                                    </h1>
                                    <p className="text-2xl text-white/90 mb-6">
                                        Plateforme d'Intelligence Manufacturière
                                    </p>
                                    <p className="text-lg text-white/80 max-w-2xl mx-auto">
                                        Solution IA de prédiction de trésorerie pour les PME manufacturières françaises
                                    </p>
                                </div>

                                {/* Features Grid */}
                                <div className="grid md:grid-cols-3 gap-8 mb-12">
                                    <div className="card">
                                        <div className="text-4xl mb-4">🤖</div>
                                        <h3 className="text-xl font-bold mb-3">IA Prédictive</h3>
                                        <p className="text-gray-600 mb-4">Modèles Prophet + LSTM avec 87% de confiance</p>
                                        <div className="text-sm text-blue-600 font-medium">
                                            ✓ 218K+ enregistrements réels
                                        </div>
                                    </div>

                                    <div className="card">
                                        <div className="text-4xl mb-4">📊</div>
                                        <h3 className="text-xl font-bold mb-3">Analytics Manufacturier</h3>
                                        <p className="text-gray-600 mb-4">KPIs de production, qualité et efficacité</p>
                                        <div className="text-sm text-green-600 font-medium">
                                            ✓ Temps réel + historique
                                        </div>
                                    </div>

                                    <div className="card">
                                        <div className="text-4xl mb-4">🇫🇷</div>
                                        <h3 className="text-xl font-bold mb-3">Conformité Française</h3>
                                        <p className="text-gray-600 mb-4">SIRET/SIREN, RGPD, EUR</p>
                                        <div className="text-sm text-purple-600 font-medium">
                                            ✓ PME manufacturing ready
                                        </div>
                                    </div>
                                </div>

                                {/* Login Section */}
                                <div className="max-w-md mx-auto card">
                                    <h2 className="text-2xl font-bold text-center mb-6">Connexion</h2>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Email</label>
                                            <input
                                                type="email"
                                                className="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                value={loginData.email}
                                                onChange={(e) => setLoginData({...loginData, email: e.target.value})}
                                                placeholder="demo@ezbi.fr"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Mot de passe</label>
                                            <input
                                                type="password"
                                                className="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                value={loginData.password}
                                                onChange={(e) => setLoginData({...loginData, password: e.target.value})}
                                                placeholder="demo123"
                                            />
                                        </div>
                                        <button type="submit" className="w-full btn-primary">
                                            Se connecter
                                        </button>
                                    </form>

                                    <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                                        <p className="text-sm text-blue-800">
                                            <strong>Demo:</strong> demo@ezbi.fr / demo123
                                        </p>
                                    </div>
                                </div>

                                {/* Quick Links */}
                                <div className="text-center mt-12">
                                    <div className="space-x-4">
                                        <a href="http://localhost:8003/test" target="_blank" className="btn-primary">
                                            🧪 Interface de Test
                                        </a>
                                        <a href="http://localhost:8003/docs" target="_blank" className="btn-primary">
                                            📚 Documentation API
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Load KPIs when dashboard view is active
            useEffect(() => {
                if (currentView === 'dashboard' && isAuthenticated) {
                    loadKPIs();
                }
            }, [currentView, isAuthenticated]);

            // Dashboard
            if (currentView === 'dashboard' && isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gray-50">
                        {/* Header */}
                        <div className="bg-white shadow-sm border-b">
                            <div className="container mx-auto px-4 py-4">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-2xl font-bold">🏭 EZBI Analytics</h1>
                                        <p className="text-gray-600">Bonjour, {user?.name || 'Jean Dupont'}</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <StatusIndicator />
                                        <button 
                                            onClick={() => {setIsAuthenticated(false); setCurrentView('home');}}
                                            className="text-red-600 hover:text-red-800"
                                        >
                                            Déconnexion
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="container mx-auto px-4 py-8">
                            {/* KPIs Grid */}
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                <div className="card">
                                    <h3 className="text-sm font-medium text-gray-600">Efficacité Production</h3>
                                    <p className="text-2xl font-bold text-green-600">
                                        {kpis?.production?.efficiency ? (kpis.production.efficiency * 100).toFixed(1) + '%' : '85%'}
                                    </p>
                                </div>
                                <div className="card">
                                    <h3 className="text-sm font-medium text-gray-600">Utilisation Capacité</h3>
                                    <p className="text-2xl font-bold text-blue-600">
                                        {kpis?.production?.capacity_utilization ? (kpis.production.capacity_utilization * 100).toFixed(1) + '%' : '78%'}
                                    </p>
                                </div>
                                <div className="card">
                                    <h3 className="text-sm font-medium text-gray-600">Position Cash</h3>
                                    <p className="text-2xl font-bold text-purple-600">
                                        {kpis?.financial?.cash_position ? '€' + kpis.financial.cash_position.toLocaleString() : '€450,000'}
                                    </p>
                                </div>
                                <div className="card">
                                    <h3 className="text-sm font-medium text-gray-600">Taux de Défaut</h3>
                                    <p className="text-2xl font-bold text-orange-600">
                                        {kpis?.production?.defect_rate ? (kpis.production.defect_rate * 100).toFixed(1) + '%' : '3%'}
                                    </p>
                                </div>
                            </div>

                            {/* Prediction Section */}
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="card">
                                    <h2 className="text-xl font-bold mb-4">Prédiction Cash Flow IA</h2>
                                    <p className="text-gray-600 mb-4">
                                        Générez une prédiction de trésorerie basée sur l'IA (Prophet + LSTM)
                                    </p>
                                    <button 
                                        onClick={generatePrediction}
                                        className="btn-primary mb-4"
                                    >
                                        🤖 Générer Prédiction
                                    </button>
                                    
                                    {prediction && (
                                        <div className="p-4 bg-green-50 rounded-lg">
                                            <h3 className="font-bold text-green-800 mb-2">Résultat Prédiction:</h3>
                                            <p className="text-lg font-bold text-green-600">
                                                €{prediction.prediction?.amount?.toLocaleString()} EUR
                                            </p>
                                            <p className="text-sm text-green-700">
                                                Confiance: {prediction.prediction?.confidence ? (prediction.prediction.confidence * 100).toFixed(1) + '%' : '87%'}
                                            </p>
                                            <p className="text-sm text-green-700">
                                                Période: {prediction.prediction?.period_days || 30} jours
                                            </p>
                                        </div>
                                    )}
                                </div>

                                <div className="card">
                                    <h2 className="text-xl font-bold mb-4">Données Manufacturières</h2>
                                    <div className="space-y-3">
                                        <div className="flex justify-between">
                                            <span>Processus Manufacturing:</span>
                                            <span className="font-bold">14,089 records</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Données Cash Flow:</span>
                                            <span className="font-bold">203,332 records</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Analyse Coûts:</span>
                                            <span className="font-bold">1,001 records</span>
                                        </div>
                                        <div className="flex justify-between border-t pt-2">
                                            <span className="font-bold">Total Dataset:</span>
                                            <span className="font-bold text-blue-600">218,422 records</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Navigation */}
                            <div className="text-center mt-8">
                                <div className="space-x-4">
                                    <a href="http://localhost:8003/api/v1/docs" target="_blank" className="btn-primary">
                                        📚 API Documentation
                                    </a>
                                    <a href="http://localhost:8003/test" target="_blank" className="btn-primary">
                                        🧪 Tests Avancés
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        // Render the app
        ReactDOM.render(<EZBIApp />, document.getElementById('app'));
    </script>
</body>
</html>
