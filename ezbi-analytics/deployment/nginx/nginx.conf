# EZBI Analytics Nginx Configuration\n# Optimized for French hosting requirements and production use\n\nuser nginx;\nworker_processes auto;\nerror_log /var/log/nginx/error.log notice;\npid /var/run/nginx.pid;\n\n# Load dynamic modules\nload_module modules/ngx_http_geoip2_module.so;\n\nevents {\n    worker_connections 1024;\n    use epoll;\n    multi_accept on;\n}\n\nhttp {\n    # Basic settings\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    \n    # Logging format\n    log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n                   '$status $body_bytes_sent \"$http_referer\" '\n                   '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n    \n    log_format json_combined escape=json\n        '{'\"time_local\":\"$time_local\",'\n        '\"remote_addr\":\"$remote_addr\",'\n        '\"remote_user\":\"$remote_user\",'\n        '\"request\":\"$request\",'\n        '\"status\": \"$status\",'\n        '\"body_bytes_sent\":\"$body_bytes_sent\",'\n        '\"request_time\":\"$request_time\",'\n        '\"http_referrer\":\"$http_referer\",'\n        '\"http_user_agent\":\"$http_user_agent\",'\n        '\"http_x_forwarded_for\":\"$http_x_forwarded_for\",'\n        '\"http_host\":\"$http_host\",'\n        '\"server_name\":\"$server_name\"'\n        '}';\n    \n    access_log /var/log/nginx/access.log json_combined;\n    \n    # Performance settings\n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout 65;\n    types_hash_max_size 2048;\n    \n    # Security settings\n    server_tokens off;\n    client_max_body_size 50M;\n    client_body_timeout 60;\n    client_header_timeout 60;\n    client_body_buffer_size 128k;\n    client_header_buffer_size 1k;\n    large_client_header_buffers 4 4k;\n    \n    # Gzip compression\n    gzip on;\n    gzip_vary on;\n    gzip_min_length 1000;\n    gzip_proxied any;\n    gzip_comp_level 6;\n    gzip_types\n        application/atom+xml\n        application/javascript\n        application/json\n        application/rss+xml\n        application/vnd.ms-fontobject\n        application/x-font-ttf\n        application/x-web-app-manifest+json\n        application/xhtml+xml\n        application/xml\n        font/opentype\n        image/svg+xml\n        image/x-icon\n        text/css\n        text/plain\n        text/x-component;\n    \n    # Rate limiting\n    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;\n    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;\n    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;\n    \n    # Connection limiting\n    limit_conn_zone $binary_remote_addr zone=addr:10m;\n    \n    # SSL settings\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;\n    ssl_prefer_server_ciphers on;\n    ssl_session_cache shared:SSL:10m;\n    ssl_session_timeout 10m;\n    ssl_stapling on;\n    ssl_stapling_verify on;\n    \n    # Security headers\n    add_header X-Frame-Options DENY always;\n    add_header X-Content-Type-Options nosniff always;\n    add_header X-XSS-Protection \"1; mode=block\" always;\n    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n    add_header Content-Security-Policy \"default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; child-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';\" always;\n    \n    # Hide server version\n    more_set_headers \"Server: EZBI Analytics\";\n    \n    # Upstream definitions\n    upstream backend {\n        least_conn;\n        server backend-service:8000 max_fails=3 fail_timeout=30s;\n        keepalive 32;\n    }\n    \n    upstream ml-engine {\n        least_conn;\n        server ml-engine-service:8001 max_fails=3 fail_timeout=30s;\n        keepalive 16;\n    }\n    \n    upstream frontend {\n        least_conn;\n        server frontend-service:3000 max_fails=3 fail_timeout=30s;\n        keepalive 32;\n    }\n    \n    # Health check endpoint\n    server {\n        listen 80;\n        server_name localhost;\n        \n        location /nginx-health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n    }\n    \n    # HTTP to HTTPS redirect\n    server {\n        listen 80;\n        server_name ezbi.example.com www.ezbi.example.com api.ezbi.example.com ml.ezbi.example.com;\n        \n        # Let's Encrypt challenge\n        location /.well-known/acme-challenge/ {\n            root /var/www/certbot;\n        }\n        \n        location / {\n            return 301 https://$server_name$request_uri;\n        }\n    }\n    \n    # Main application (Frontend)\n    server {\n        listen 443 ssl http2;\n        server_name ezbi.example.com www.ezbi.example.com;\n        \n        # SSL certificates\n        ssl_certificate /etc/nginx/ssl/ezbi.example.com.crt;\n        ssl_certificate_key /etc/nginx/ssl/ezbi.example.com.key;\n        \n        # Security headers specific to frontend\n        add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\n        \n        # Rate limiting\n        limit_req zone=api burst=200 nodelay;\n        limit_conn addr 20;\n        \n        # Frontend proxy\n        location / {\n            proxy_pass http://frontend;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Timeouts\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_read_timeout 60s;\n            \n            # Buffer settings\n            proxy_buffering on;\n            proxy_buffer_size 128k;\n            proxy_buffers 4 256k;\n            proxy_busy_buffers_size 256k;\n            \n            # WebSocket support\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n        }\n        \n        # Static files caching\n        location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n            proxy_pass http://frontend;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            \n            expires 1y;\n            add_header Cache-Control \"public, immutable\";\n            add_header Vary Accept-Encoding;\n        }\n    }\n    \n    # API server\n    server {\n        listen 443 ssl http2;\n        server_name api.ezbi.example.com;\n        \n        # SSL certificates\n        ssl_certificate /etc/nginx/ssl/api.ezbi.example.com.crt;\n        ssl_certificate_key /etc/nginx/ssl/api.ezbi.example.com.key;\n        \n        # Security headers\n        add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\n        \n        # Rate limiting for API\n        limit_req zone=api burst=100 nodelay;\n        limit_conn addr 10;\n        \n        # API proxy\n        location / {\n            proxy_pass http://backend;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Timeouts\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_read_timeout 60s;\n            \n            # Buffer settings\n            proxy_buffering on;\n            proxy_buffer_size 128k;\n            proxy_buffers 4 256k;\n            proxy_busy_buffers_size 256k;\n        }\n        \n        # Authentication endpoints (stricter rate limiting)\n        location ~* ^/api/v1/(auth|login|register|password-reset) {\n            limit_req zone=auth burst=20 nodelay;\n            \n            proxy_pass http://backend;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Timeouts\n            proxy_connect_timeout 30s;\n            proxy_send_timeout 30s;\n            proxy_read_timeout 30s;\n        }\n        \n        # File upload endpoints\n        location ~* ^/api/v1/(upload|files) {\n            limit_req zone=upload burst=10 nodelay;\n            \n            client_max_body_size 100M;\n            client_body_timeout 300s;\n            \n            proxy_pass http://backend;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Extended timeouts for file uploads\n            proxy_connect_timeout 300s;\n            proxy_send_timeout 300s;\n            proxy_read_timeout 300s;\n            \n            # Buffer settings for large files\n            proxy_buffering off;\n            proxy_request_buffering off;\n        }\n    }\n    \n    # ML Engine server\n    server {\n        listen 443 ssl http2;\n        server_name ml.ezbi.example.com;\n        \n        # SSL certificates\n        ssl_certificate /etc/nginx/ssl/ml.ezbi.example.com.crt;\n        ssl_certificate_key /etc/nginx/ssl/ml.ezbi.example.com.key;\n        \n        # Security headers\n        add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\n        \n        # Rate limiting for ML API\n        limit_req zone=api burst=50 nodelay;\n        limit_conn addr 5;\n        \n        # ML Engine proxy\n        location / {\n            proxy_pass http://ml-engine;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Extended timeouts for ML processing\n            proxy_connect_timeout 120s;\n            proxy_send_timeout 120s;\n            proxy_read_timeout 120s;\n            \n            # Buffer settings\n            proxy_buffering on;\n            proxy_buffer_size 128k;\n            proxy_buffers 4 256k;\n            proxy_busy_buffers_size 256k;\n        }\n        \n        # Prediction endpoints (special handling)\n        location ~* ^/(predict|inference|batch) {\n            limit_req zone=api burst=20 nodelay;\n            \n            proxy_pass http://ml-engine;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $server_name;\n            \n            # Very extended timeouts for heavy ML operations\n            proxy_connect_timeout 300s;\n            proxy_send_timeout 300s;\n            proxy_read_timeout 300s;\n            \n            # Large buffer for ML responses\n            proxy_buffering on;\n            proxy_buffer_size 256k;\n            proxy_buffers 8 256k;\n            proxy_busy_buffers_size 512k;\n        }\n    }\n    \n    # Monitoring endpoints (protected)\n    server {\n        listen 443 ssl http2;\n        server_name monitoring.ezbi.example.com;\n        \n        # SSL certificates\n        ssl_certificate /etc/nginx/ssl/monitoring.ezbi.example.com.crt;\n        ssl_certificate_key /etc/nginx/ssl/monitoring.ezbi.example.com.key;\n        \n        # Basic authentication\n        auth_basic \"EZBI Analytics Monitoring\";\n        auth_basic_user_file /etc/nginx/.htpasswd;\n        \n        # Security headers\n        add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\n        \n        # IP whitelist (replace with actual monitoring IPs)\n        allow 10.0.0.0/8;\n        allow 172.16.0.0/12;\n        allow 192.168.0.0/16;\n        deny all;\n        \n        # Prometheus\n        location /prometheus/ {\n            proxy_pass http://prometheus-service:9090/;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n        \n        # Grafana\n        location /grafana/ {\n            proxy_pass http://grafana-service:3000/;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n    }\n    \n    # Error pages\n    error_page 404 /404.html;\n    error_page 500 502 503 504 /50x.html;\n    \n    location = /404.html {\n        root /usr/share/nginx/html;\n        internal;\n    }\n    \n    location = /50x.html {\n        root /usr/share/nginx/html;\n        internal;\n    }\n    \n    # Deny access to hidden files\n    location ~ /\\. {\n        deny all;\n        access_log off;\n        log_not_found off;\n    }\n    \n    # Deny access to backup files\n    location ~* \\.(bak|backup|old|orig|tmp)$ {\n        deny all;\n        access_log off;\n        log_not_found off;\n    }\n}\n\n# Stream configuration for TCP/UDP load balancing\nstream {\n    # PostgreSQL load balancing (if needed)\n    upstream postgres {\n        server postgres-service:5432;\n    }\n    \n    # Redis load balancing (if needed)\n    upstream redis {\n        server redis-service:6379;\n    }\n    \n    # Log format for stream\n    log_format stream_routing '$remote_addr [$time_local] $protocol $bytes_sent $bytes_received $session_time';\n    \n    # PostgreSQL proxy (internal use only)\n    server {\n        listen 5432;\n        proxy_pass postgres;\n        proxy_timeout 1s;\n        proxy_responses 1;\n        proxy_bind $remote_addr transparent;\n    }\n    \n    # Redis proxy (internal use only)\n    server {\n        listen 6379;\n        proxy_pass redis;\n        proxy_timeout 1s;\n        proxy_responses 1;\n        proxy_bind $remote_addr transparent;\n    }\n}"