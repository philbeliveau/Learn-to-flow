apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: prometheus-deployment\n  namespace: ezbi-analytics\n  labels:\n    app: prometheus\n    tier: monitoring\nspec:\n  replicas: 1\n  strategy:\n    type: Recreate\n  selector:\n    matchLabels:\n      app: prometheus\n      tier: monitoring\n  template:\n    metadata:\n      labels:\n        app: prometheus\n        tier: monitoring\n    spec:\n      serviceAccountName: prometheus\n      containers:\n      - name: prometheus\n        image: prom/prometheus:latest\n        args:\n          - '--config.file=/etc/prometheus/prometheus.yml'\n          - '--storage.tsdb.path=/prometheus'\n          - '--web.console.libraries=/etc/prometheus/console_libraries'\n          - '--web.console.templates=/etc/prometheus/consoles'\n          - '--storage.tsdb.retention.time=30d'\n          - '--web.enable-lifecycle'\n          - '--web.enable-admin-api'\n        ports:\n        - containerPort: 9090\n          name: prometheus\n        volumeMounts:\n        - name: prometheus-config\n          mountPath: /etc/prometheus\n        - name: prometheus-storage\n          mountPath: /prometheus\n        livenessProbe:\n          httpGet:\n            path: /-/healthy\n            port: 9090\n          initialDelaySeconds: 30\n          periodSeconds: 10\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /-/ready\n            port: 9090\n          initialDelaySeconds: 5\n          periodSeconds: 5\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        resources:\n          requests:\n            memory: \"512Mi\"\n            cpu: \"250m\"\n          limits:\n            memory: \"1Gi\"\n            cpu: \"500m\"\n      volumes:\n      - name: prometheus-config\n        configMap:\n          name: prometheus-config\n      - name: prometheus-storage\n        persistentVolumeClaim:\n          claimName: prometheus-pvc\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: prometheus-service\n  namespace: ezbi-analytics\n  labels:\n    app: prometheus\n    tier: monitoring\nspec:\n  selector:\n    app: prometheus\n    tier: monitoring\n  ports:\n  - port: 9090\n    targetPort: 9090\n    protocol: TCP\n    name: prometheus\n  type: ClusterIP\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: grafana-deployment\n  namespace: ezbi-analytics\n  labels:\n    app: grafana\n    tier: monitoring\nspec:\n  replicas: 1\n  strategy:\n    type: Recreate\n  selector:\n    matchLabels:\n      app: grafana\n      tier: monitoring\n  template:\n    metadata:\n      labels:\n        app: grafana\n        tier: monitoring\n    spec:\n      containers:\n      - name: grafana\n        image: grafana/grafana:latest\n        env:\n        - name: GF_SECURITY_ADMIN_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: grafana-password\n        - name: GF_USERS_ALLOW_SIGN_UP\n          value: \"false\"\n        - name: GF_INSTALL_PLUGINS\n          value: \"grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel\"\n        ports:\n        - containerPort: 3000\n          name: grafana\n        volumeMounts:\n        - name: grafana-storage\n          mountPath: /var/lib/grafana\n        - name: grafana-provisioning\n          mountPath: /etc/grafana/provisioning\n        - name: grafana-dashboards\n          mountPath: /var/lib/grafana/dashboards\n        livenessProbe:\n          httpGet:\n            path: /api/health\n            port: 3000\n          initialDelaySeconds: 30\n          periodSeconds: 10\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /api/health\n            port: 3000\n          initialDelaySeconds: 5\n          periodSeconds: 5\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        resources:\n          requests:\n            memory: \"256Mi\"\n            cpu: \"125m\"\n          limits:\n            memory: \"512Mi\"\n            cpu: \"250m\"\n      volumes:\n      - name: grafana-storage\n        persistentVolumeClaim:\n          claimName: grafana-pvc\n      - name: grafana-provisioning\n        configMap:\n          name: grafana-provisioning\n      - name: grafana-dashboards\n        configMap:\n          name: grafana-dashboards\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: grafana-service\n  namespace: ezbi-analytics\n  labels:\n    app: grafana\n    tier: monitoring\nspec:\n  selector:\n    app: grafana\n    tier: monitoring\n  ports:\n  - port: 3000\n    targetPort: 3000\n    protocol: TCP\n    name: grafana\n  type: ClusterIP\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: prometheus\n  namespace: ezbi-analytics\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: prometheus\nrules:\n- apiGroups: [\"\"]\n  resources:\n  - nodes\n  - nodes/proxy\n  - services\n  - endpoints\n  - pods\n  verbs: [\"get\", \"list\", \"watch\"]\n- apiGroups:\n  - extensions\n  resources:\n  - ingresses\n  verbs: [\"get\", \"list\", \"watch\"]\n- nonResourceURLs: [\"/metrics\"]\n  verbs: [\"get\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: prometheus\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: prometheus\nsubjects:\n- kind: ServiceAccount\n  name: prometheus\n  namespace: ezbi-analytics\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: prometheus-config\n  namespace: ezbi-analytics\ndata:\n  prometheus.yml: |\n    global:\n      scrape_interval: 15s\n      evaluation_interval: 15s\n      external_labels:\n        monitor: 'ezbi-analytics'\n        cluster: 'production'\n        region: 'france'\n    \n    rule_files:\n      - \"alert.rules.yml\"\n    \n    scrape_configs:\n      - job_name: 'prometheus'\n        static_configs:\n          - targets: ['localhost:9090']\n      \n      - job_name: 'ezbi-backend'\n        kubernetes_sd_configs:\n          - role: endpoints\n            namespaces:\n              names:\n                - ezbi-analytics\n        relabel_configs:\n          - source_labels: [__meta_kubernetes_service_name]\n            action: keep\n            regex: backend-service\n        metrics_path: /metrics\n        scrape_interval: 30s\n      \n      - job_name: 'ezbi-ml-engine'\n        kubernetes_sd_configs:\n          - role: endpoints\n            namespaces:\n              names:\n                - ezbi-analytics\n        relabel_configs:\n          - source_labels: [__meta_kubernetes_service_name]\n            action: keep\n            regex: ml-engine-service\n        metrics_path: /metrics\n        scrape_interval: 30s\n  \n  alert.rules.yml: |\n    groups:\n      - name: ezbi-analytics.rules\n        rules:\n          - alert: HighCPUUsage\n            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 80\n            for: 5m\n            labels:\n              severity: warning\n              service: system\n            annotations:\n              summary: \"High CPU usage detected\"\n              description: \"CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}\"\n          \n          - alert: ServiceDown\n            expr: up == 0\n            for: 1m\n            labels:\n              severity: critical\n              service: \"{{ $labels.job }}\"\n            annotations:\n              summary: \"Service {{ $labels.job }} is down\"\n              description: \"Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute\"\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: grafana-provisioning\n  namespace: ezbi-analytics\ndata:\n  datasources.yaml: |\n    apiVersion: 1\n    datasources:\n      - name: Prometheus\n        type: prometheus\n        access: proxy\n        url: http://prometheus-service:9090\n        isDefault: true\n  \n  dashboards.yaml: |\n    apiVersion: 1\n    providers:\n      - name: 'default'\n        orgId: 1\n        folder: ''\n        type: file\n        disableDeletion: false\n        updateIntervalSeconds: 10\n        options:\n          path: /var/lib/grafana/dashboards\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: grafana-dashboards\n  namespace: ezbi-analytics\ndata:\n  ezbi-overview.json: |\n    {\n      \"dashboard\": {\n        \"id\": null,\n        \"title\": \"EZBI Analytics Overview\",\n        \"tags\": [\"ezbi\", \"analytics\"],\n        \"timezone\": \"browser\",\n        \"panels\": [\n          {\n            \"id\": 1,\n            \"title\": \"System Overview\",\n            \"type\": \"stat\",\n            \"targets\": [\n              {\n                \"expr\": \"up\",\n                \"legendFormat\": \"Services Up\"\n              }\n            ],\n            \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 0}\n          }\n        ],\n        \"time\": {\n          \"from\": \"now-1h\",\n          \"to\": \"now\"\n        },\n        \"refresh\": \"30s\"\n      }\n    }"