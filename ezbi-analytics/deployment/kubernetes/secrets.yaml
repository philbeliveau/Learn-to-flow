apiVersion: v1
kind: Secret
metadata:
  name: ezbi-analytics-secrets
  namespace: ezbi-analytics
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  postgres-password: ZXpiaV9zZWN1cmVfcGFzc3dvcmQ=  # ezbi_secure_password
  redis-password: ZXpiaV9yZWRpc19wYXNzd29yZA==      # ezbi_redis_password
  secret-key: eW91ci1zZWNyZXQta2V5LWhlcmU=          # your-secret-key-here
  grafana-password: YWRtaW4=                         # admin
---
apiVersion: v1
kind: Secret
metadata:
  name: ezbi-analytics-tls
  namespace: ezbi-analytics
type: kubernetes.io/tls
data:
  # Replace with actual TLS certificate and key
  tls.crt: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    # Your TLS certificate here
    LS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQ==
  tls.key: |
    LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t
    # Your TLS private key here
    LS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQ==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ezbi-analytics-config
  namespace: ezbi-analytics
data:
  # Database configuration
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ezbi_analytics"
  DATABASE_USER: "ezbi_user"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Application configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://ezbi.example.com,https://www.ezbi.example.com"
  
  # ML Engine configuration
  ML_MODEL_PATH: "/app/models"
  ML_INFERENCE_HOST: "0.0.0.0"
  ML_INFERENCE_PORT: "8001"
  
  # Monitoring configuration
  PROMETHEUS_HOST: "prometheus-service"
  PROMETHEUS_PORT: "9090"
  GRAFANA_HOST: "grafana-service"
  GRAFANA_PORT: "3000"