apiVersion: v1
kind: Namespace
metadata:
  name: ezbi-analytics
  labels:
    name: ezbi-analytics
    app.kubernetes.io/name: ezbi-analytics
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: ezbi-analytics
    app.kubernetes.io/managed-by: kubernetes
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ezbi-analytics-quota
  namespace: ezbi-analytics
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ezbi-analytics-network-policy
  namespace: ezbi-analytics
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ezbi-analytics
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ezbi-analytics
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443