apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: ezbi-analytics
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: ezbi/frontend:latest
        env:
        - name: NEXT_PUBLIC_API_URL
          value: \"https://api.ezbi.example.com\"\n        - name: NEXT_PUBLIC_ML_API_URL\n          value: \"https://ml.ezbi.example.com\"\n        - name: NODE_ENV\n          value: \"production\"\n        - name: NEXT_TELEMETRY_DISABLED\n          value: \"1\"\n        ports:\n        - containerPort: 3000\n          name: http\n        livenessProbe:\n          httpGet:\n            path: /api/health\n            port: http\n          initialDelaySeconds: 30\n          periodSeconds: 10\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /api/health\n            port: http\n          initialDelaySeconds: 5\n          periodSeconds: 5\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        resources:\n          requests:\n            memory: \"256Mi\"\n            cpu: \"125m\"\n          limits:\n            memory: \"512Mi\"\n            cpu: \"250m\"\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: frontend-service\n  namespace: ezbi-analytics\n  labels:\n    app: frontend\n    tier: frontend\nspec:\n  selector:\n    app: frontend\n    tier: frontend\n  ports:\n  - port: 3000\n    targetPort: 3000\n    protocol: TCP\n    name: http\n  type: ClusterIP\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: frontend-hpa\n  namespace: ezbi-analytics\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: frontend-deployment\n  minReplicas: 2\n  maxReplicas: 6\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: Resource\n    resource:\n      name: memory\n      target:\n        type: Utilization\n        averageUtilization: 80\n  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 300\n      policies:\n      - type: Percent\n        value: 10\n        periodSeconds: 60\n    scaleUp:\n      stabilizationWindowSeconds: 0\n      policies:\n      - type: Percent\n        value: 50\n        periodSeconds: 15\n      - type: Pods\n        value: 2\n        periodSeconds: 15\n      selectPolicy: Max