apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine-deployment
  namespace: ezbi-analytics
  labels:
    app: ml-engine
    tier: ml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ml-engine
      tier: ml
  template:
    metadata:
      labels:
        app: ml-engine
        tier: ml
    spec:\n      containers:\n      - name: ml-engine\n        image: ezbi/ml-engine:latest\n        env:\n        - name: DATABASE_URL\n          value: \"postgresql://$(DATABASE_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)\"\n        - name: DATABASE_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_HOST\n        - name: DATABASE_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_PORT\n        - name: DATABASE_NAME\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_NAME\n        - name: DATABASE_USER\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_USER\n        - name: POSTGRES_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: postgres-password\n        - name: REDIS_URL\n          value: \"redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1\"\n        - name: REDIS_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_HOST\n        - name: REDIS_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_PORT\n        - name: REDIS_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: redis-password\n        - name: MODEL_PATH\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: ML_MODEL_PATH\n        - name: INFERENCE_SERVER_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: ML_INFERENCE_HOST\n        - name: INFERENCE_SERVER_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: ML_INFERENCE_PORT\n        ports:\n        - containerPort: 8001\n          name: http\n        livenessProbe:\n          httpGet:\n            path: /health\n            port: http\n          initialDelaySeconds: 60\n          periodSeconds: 10\n          timeoutSeconds: 10\n          successThreshold: 1\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /health\n            port: http\n          initialDelaySeconds: 30\n          periodSeconds: 5\n          timeoutSeconds: 10\n          successThreshold: 1\n          failureThreshold: 3\n        resources:\n          requests:\n            memory: \"1Gi\"\n            cpu: \"500m\"\n          limits:\n            memory: \"2Gi\"\n            cpu: \"1000m\"\n        volumeMounts:\n        - name: ml-models\n          mountPath: /app/models\n        - name: logs\n          mountPath: /app/logs\n        - name: data\n          mountPath: /app/data\n      volumes:\n      - name: ml-models\n        persistentVolumeClaim:\n          claimName: ml-models-pvc\n      - name: logs\n        emptyDir: {}\n      - name: data\n        emptyDir: {}\n      initContainers:\n      - name: wait-for-postgres\n        image: postgres:15-alpine\n        command:\n        - sh\n        - -c\n        - |\n          until pg_isready -h $DATABASE_HOST -p $DATABASE_PORT -U $DATABASE_USER; do\n            echo \"Waiting for postgres...\"\n            sleep 2\n          done\n        env:\n        - name: DATABASE_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_HOST\n        - name: DATABASE_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_PORT\n        - name: DATABASE_USER\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_USER\n      - name: wait-for-redis\n        image: redis:7-alpine\n        command:\n        - sh\n        - -c\n        - |\n          until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do\n            echo \"Waiting for redis...\"\n            sleep 2\n          done\n        env:\n        - name: REDIS_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_HOST\n        - name: REDIS_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_PORT\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: ml-engine-service\n  namespace: ezbi-analytics\n  labels:\n    app: ml-engine\n    tier: ml\nspec:\n  selector:\n    app: ml-engine\n    tier: ml\n  ports:\n  - port: 8001\n    targetPort: 8001\n    protocol: TCP\n    name: http\n  type: ClusterIP\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: ml-engine-hpa\n  namespace: ezbi-analytics\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: ml-engine-deployment\n  minReplicas: 2\n  maxReplicas: 8\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: Resource\n    resource:\n      name: memory\n      target:\n        type: Utilization\n        averageUtilization: 80\n  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 300\n      policies:\n      - type: Percent\n        value: 10\n        periodSeconds: 60\n    scaleUp:\n      stabilizationWindowSeconds: 0\n      policies:\n      - type: Percent\n        value: 100\n        periodSeconds: 15\n      - type: Pods\n        value: 2\n        periodSeconds: 15\n      selectPolicy: Max