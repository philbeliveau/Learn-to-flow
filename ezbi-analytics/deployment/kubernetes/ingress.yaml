apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ezbi-analytics-ingress
  namespace: ezbi-analytics
  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\n    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/force-ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/proxy-body-size: \"50m\"\n    nginx.ingress.kubernetes.io/proxy-read-timeout: \"300\"\n    nginx.ingress.kubernetes.io/proxy-send-timeout: \"300\"\n    nginx.ingress.kubernetes.io/client-body-buffer-size: \"128k\"\n    nginx.ingress.kubernetes.io/client-body-timeout: \"60\"\n    nginx.ingress.kubernetes.io/client-header-timeout: \"60\"\n    nginx.ingress.kubernetes.io/proxy-buffering: \"on\"\n    nginx.ingress.kubernetes.io/proxy-buffer-size: \"128k\"\n    nginx.ingress.kubernetes.io/proxy-buffers-number: \"4\"\n    nginx.ingress.kubernetes.io/use-regex: \"true\"\n    cert-manager.io/cluster-issuer: \"letsencrypt-prod\"\n    nginx.ingress.kubernetes.io/rate-limit: \"100\"\n    nginx.ingress.kubernetes.io/rate-limit-window: \"1m\"\nspec:\n  ingressClassName: nginx\n  tls:\n  - hosts:\n    - ezbi.example.com\n    - www.ezbi.example.com\n    - api.ezbi.example.com\n    - ml.ezbi.example.com\n    secretName: ezbi-analytics-tls\n  rules:\n  - host: ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: frontend-service\n            port:\n              number: 3000\n  - host: www.ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: frontend-service\n            port:\n              number: 3000\n  - host: api.ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: backend-service\n            port:\n              number: 8000\n  - host: ml.ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: ml-engine-service\n            port:\n              number: 8001\n---\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: ezbi-analytics-monitoring-ingress\n  namespace: ezbi-analytics\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\n    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/force-ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/auth-type: basic\n    nginx.ingress.kubernetes.io/auth-secret: monitoring-auth\n    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - EZBI Monitoring'\n    cert-manager.io/cluster-issuer: \"letsencrypt-prod\"\nspec:\n  ingressClassName: nginx\n  tls:\n  - hosts:\n    - prometheus.ezbi.example.com\n    - grafana.ezbi.example.com\n    secretName: ezbi-analytics-monitoring-tls\n  rules:\n  - host: prometheus.ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: prometheus-service\n            port:\n              number: 9090\n  - host: grafana.ezbi.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: grafana-service\n            port:\n              number: 3000\n---\napiVersion: v1\nkind: Secret\nmetadata:\n  name: monitoring-auth\n  namespace: ezbi-analytics\ntype: Opaque\ndata:\n  # admin:$2y$10$1234567890123456789012345678901234567890123456789012345678\n  # Replace with actual htpasswd generated credentials\n  auth: YWRtaW46JDJ5JDEwJDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODk=