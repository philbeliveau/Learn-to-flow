apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ezbi-analytics
  labels:
    app: backend
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
      tier: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: ezbi/backend:latest
        env:
        - name: DATABASE_URL
          value: \"postgresql://$(DATABASE_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)\"\n        - name: DATABASE_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_HOST\n        - name: DATABASE_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_PORT\n        - name: DATABASE_NAME\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_NAME\n        - name: DATABASE_USER\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_USER\n        - name: POSTGRES_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: postgres-password\n        - name: REDIS_URL\n          value: \"redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)\"\n        - name: REDIS_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_HOST\n        - name: REDIS_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_PORT\n        - name: REDIS_DB\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_DB\n        - name: REDIS_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: redis-password\n        - name: SECRET_KEY\n          valueFrom:\n            secretKeyRef:\n              name: ezbi-analytics-secrets\n              key: secret-key\n        - name: ENVIRONMENT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: ENVIRONMENT\n        - name: LOG_LEVEL\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: LOG_LEVEL\n        - name: CORS_ORIGINS\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: CORS_ORIGINS\n        ports:\n        - containerPort: 8000\n          name: http\n        livenessProbe:\n          httpGet:\n            path: /health\n            port: http\n          initialDelaySeconds: 30\n          periodSeconds: 10\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /health\n            port: http\n          initialDelaySeconds: 5\n          periodSeconds: 5\n          timeoutSeconds: 5\n          successThreshold: 1\n          failureThreshold: 3\n        resources:\n          requests:\n            memory: \"512Mi\"\n            cpu: \"250m\"\n          limits:\n            memory: \"1Gi\"\n            cpu: \"500m\"\n        volumeMounts:\n        - name: logs\n          mountPath: /app/logs\n        - name: uploads\n          mountPath: /app/uploads\n      volumes:\n      - name: logs\n        emptyDir: {}\n      - name: uploads\n        emptyDir: {}\n      initContainers:\n      - name: wait-for-postgres\n        image: postgres:15-alpine\n        command:\n        - sh\n        - -c\n        - |\n          until pg_isready -h $DATABASE_HOST -p $DATABASE_PORT -U $DATABASE_USER; do\n            echo \"Waiting for postgres...\"\n            sleep 2\n          done\n        env:\n        - name: DATABASE_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_HOST\n        - name: DATABASE_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_PORT\n        - name: DATABASE_USER\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: DATABASE_USER\n      - name: wait-for-redis\n        image: redis:7-alpine\n        command:\n        - sh\n        - -c\n        - |\n          until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do\n            echo \"Waiting for redis...\"\n            sleep 2\n          done\n        env:\n        - name: REDIS_HOST\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_HOST\n        - name: REDIS_PORT\n          valueFrom:\n            configMapKeyRef:\n              name: ezbi-analytics-config\n              key: REDIS_PORT\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: backend-service\n  namespace: ezbi-analytics\n  labels:\n    app: backend\n    tier: backend\nspec:\n  selector:\n    app: backend\n    tier: backend\n  ports:\n  - port: 8000\n    targetPort: 8000\n    protocol: TCP\n    name: http\n  type: ClusterIP\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: backend-hpa\n  namespace: ezbi-analytics\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: backend-deployment\n  minReplicas: 3\n  maxReplicas: 10\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: Resource\n    resource:\n      name: memory\n      target:\n        type: Utilization\n        averageUtilization: 80\n  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 300\n      policies:\n      - type: Percent\n        value: 10\n        periodSeconds: 60\n    scaleUp:\n      stabilizationWindowSeconds: 0\n      policies:\n      - type: Percent\n        value: 100\n        periodSeconds: 15\n      - type: Pods\n        value: 4\n        periodSeconds: 15\n      selectPolicy: Max