groups:\n  - name: ezbi-analytics.rules\n    rules:\n      # High CPU usage\n      - alert: HighCPUUsage\n        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 80\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"High CPU usage detected\"\n          description: \"CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}\"\n\n      # High memory usage\n      - alert: HighMemoryUsage\n        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"High memory usage detected\"\n          description: \"Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}\"\n\n      # Disk space warning\n      - alert: DiskSpaceWarning\n        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 > 80\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"Disk space warning\"\n          description: \"Disk usage is above 80% on {{ $labels.instance }} filesystem {{ $labels.mountpoint }}\"\n\n      # Disk space critical\n      - alert: DiskSpaceCritical\n        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 > 95\n        for: 1m\n        labels:\n          severity: critical\n          service: system\n        annotations:\n          summary: \"Disk space critical\"\n          description: \"Disk usage is above 95% on {{ $labels.instance }} filesystem {{ $labels.mountpoint }}\"\n\n      # Service down\n      - alert: ServiceDown\n        expr: up == 0\n        for: 1m\n        labels:\n          severity: critical\n          service: \"{{ $labels.job }}\"\n        annotations:\n          summary: \"Service {{ $labels.job }} is down\"\n          description: \"Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute\"\n\n      # High HTTP error rate\n      - alert: HighHTTPErrorRate\n        expr: rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m]) > 0.1\n        for: 5m\n        labels:\n          severity: warning\n          service: \"{{ $labels.job }}\"\n        annotations:\n          summary: \"High HTTP error rate\"\n          description: \"HTTP error rate is above 10% for {{ $labels.job }} on {{ $labels.instance }}\"\n\n      # High response time\n      - alert: HighResponseTime\n        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1\n        for: 5m\n        labels:\n          severity: warning\n          service: \"{{ $labels.job }}\"\n        annotations:\n          summary: \"High response time\"\n          description: \"95th percentile response time is above 1 second for {{ $labels.job }} on {{ $labels.instance }}\"\n\n      # Database connection issues\n      - alert: DatabaseConnectionError\n        expr: increase(database_connection_errors_total[5m]) > 10\n        for: 1m\n        labels:\n          severity: critical\n          service: database\n        annotations:\n          summary: \"Database connection errors\"\n          description: \"More than 10 database connection errors in the last 5 minutes on {{ $labels.instance }}\"\n\n      # Redis connection issues\n      - alert: RedisConnectionError\n        expr: redis_up == 0\n        for: 1m\n        labels:\n          severity: critical\n          service: redis\n        annotations:\n          summary: \"Redis is down\"\n          description: \"Redis service is down on {{ $labels.instance }}\"\n\n      # ML model prediction errors\n      - alert: MLModelErrors\n        expr: increase(ml_prediction_errors_total[5m]) > 5\n        for: 2m\n        labels:\n          severity: warning\n          service: ml-engine\n        annotations:\n          summary: \"ML model prediction errors\"\n          description: \"More than 5 ML prediction errors in the last 5 minutes on {{ $labels.instance }}\"\n\n      # Container restart\n      - alert: ContainerRestart\n        expr: increase(kube_pod_container_status_restarts_total[1h]) > 0\n        for: 0m\n        labels:\n          severity: warning\n          service: kubernetes\n        annotations:\n          summary: \"Container has restarted\"\n          description: \"Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour\"\n\n      # Pod not ready\n      - alert: PodNotReady\n        expr: kube_pod_status_ready{condition=\"false\"} == 1\n        for: 5m\n        labels:\n          severity: warning\n          service: kubernetes\n        annotations:\n          summary: \"Pod not ready\"\n          description: \"Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 5 minutes\"\n\n      # Deployment rollout stuck\n      - alert: DeploymentRolloutStuck\n        expr: kube_deployment_status_condition{condition=\"Progressing\", status=\"false\"} == 1\n        for: 10m\n        labels:\n          severity: critical\n          service: kubernetes\n        annotations:\n          summary: \"Deployment rollout stuck\"\n          description: \"Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} rollout is stuck\"\n\n      # High number of pending pods\n      - alert: HighPendingPods\n        expr: kube_pod_status_phase{phase=\"Pending\"} > 5\n        for: 5m\n        labels:\n          severity: warning\n          service: kubernetes\n        annotations:\n          summary: \"High number of pending pods\"\n          description: \"There are {{ $value }} pending pods in namespace {{ $labels.namespace }}\"\n\n      # Node not ready\n      - alert: NodeNotReady\n        expr: kube_node_status_condition{condition=\"Ready\", status=\"false\"} == 1\n        for: 5m\n        labels:\n          severity: critical\n          service: kubernetes\n        annotations:\n          summary: \"Node not ready\"\n          description: \"Node {{ $labels.node }} has been not ready for more than 5 minutes\"\n\n  - name: ezbi-business.rules\n    rules:\n      # Low prediction accuracy\n      - alert: LowPredictionAccuracy\n        expr: ml_prediction_accuracy < 0.7\n        for: 10m\n        labels:\n          severity: warning\n          service: ml-engine\n        annotations:\n          summary: \"Low ML prediction accuracy\"\n          description: \"ML model accuracy has dropped below 70% for {{ $labels.model }} on {{ $labels.instance }}\"\n\n      # High data ingestion errors\n      - alert: HighDataIngestionErrors\n        expr: increase(data_ingestion_errors_total[5m]) > 3\n        for: 2m\n        labels:\n          severity: warning\n          service: backend\n        annotations:\n          summary: \"High data ingestion errors\"\n          description: \"More than 3 data ingestion errors in the last 5 minutes on {{ $labels.instance }}\"\n\n      # File upload failures\n      - alert: FileUploadFailures\n        expr: increase(file_upload_failures_total[5m]) > 5\n        for: 2m\n        labels:\n          severity: warning\n          service: backend\n        annotations:\n          summary: \"File upload failures\"\n          description: \"More than 5 file upload failures in the last 5 minutes on {{ $labels.instance }}\"\n\n      # Authentication failures\n      - alert: HighAuthenticationFailures\n        expr: increase(authentication_failures_total[5m]) > 10\n        for: 2m\n        labels:\n          severity: warning\n          service: backend\n        annotations:\n          summary: \"High authentication failures\"\n          description: \"More than 10 authentication failures in the last 5 minutes on {{ $labels.instance }}\"\n\n      # API rate limit exceeded\n      - alert: APIRateLimitExceeded\n        expr: increase(api_rate_limit_exceeded_total[5m]) > 20\n        for: 1m\n        labels:\n          severity: warning\n          service: backend\n        annotations:\n          summary: \"API rate limit exceeded\"\n          description: \"API rate limit has been exceeded more than 20 times in the last 5 minutes on {{ $labels.instance }}\""