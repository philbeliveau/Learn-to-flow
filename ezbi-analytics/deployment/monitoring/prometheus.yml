global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n  external_labels:\n    monitor: 'ezbi-analytics'\n    cluster: 'production'\n    region: 'france'\n\nrule_files:\n  - \"alert.rules.yml\"\n\nalerting:\n  alertmanagers:\n    - static_configs:\n        - targets:\n          - alertmanager:9093\n\nscrape_configs:\n  # Prometheus itself\n  - job_name: 'prometheus'\n    static_configs:\n      - targets: ['localhost:9090']\n\n  # Kubernetes API server\n  - job_name: 'kubernetes-apiservers'\n    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n          names:\n            - default\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]\n        action: keep\n        regex: default;kubernetes;https\n\n  # Kubernetes nodes\n  - job_name: 'kubernetes-nodes'\n    kubernetes_sd_configs:\n      - role: node\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      - target_label: __address__\n        replacement: kubernetes.default.svc:443\n      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n        target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics\n\n  # Kubernetes pods\n  - job_name: 'kubernetes-pods'\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names:\n            - ezbi-analytics\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n        action: replace\n        target_label: __metrics_path__\n        regex: (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement: $1:$2\n        target_label: __address__\n      - action: labelmap\n        regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n        action: replace\n        target_label: kubernetes_namespace\n      - source_labels: [__meta_kubernetes_pod_name]\n        action: replace\n        target_label: kubernetes_pod_name\n\n  # EZBI Analytics Backend\n  - job_name: 'ezbi-backend'\n    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n          names:\n            - ezbi-analytics\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_service_name]\n        action: keep\n        regex: backend-service\n      - source_labels: [__meta_kubernetes_endpoint_port_name]\n        action: keep\n        regex: http\n    metrics_path: /metrics\n    scrape_interval: 30s\n\n  # EZBI Analytics ML Engine\n  - job_name: 'ezbi-ml-engine'\n    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n          names:\n            - ezbi-analytics\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_service_name]\n        action: keep\n        regex: ml-engine-service\n      - source_labels: [__meta_kubernetes_endpoint_port_name]\n        action: keep\n        regex: http\n    metrics_path: /metrics\n    scrape_interval: 30s\n\n  # PostgreSQL\n  - job_name: 'postgres'\n    static_configs:\n      - targets: ['postgres-service:5432']\n    metrics_path: /metrics\n    scrape_interval: 30s\n\n  # Redis\n  - job_name: 'redis'\n    static_configs:\n      - targets: ['redis-service:6379']\n    metrics_path: /metrics\n    scrape_interval: 30s\n\n  # Node Exporter\n  - job_name: 'node-exporter'\n    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n          names:\n            - ezbi-analytics\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_service_name]\n        action: keep\n        regex: node-exporter\n    scrape_interval: 30s\n\n  # Cadvisor\n  - job_name: 'cadvisor'\n    kubernetes_sd_configs:\n      - role: node\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n      - target_label: __address__\n        replacement: kubernetes.default.svc:443\n      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n        target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor\n    scrape_interval: 30s\n\n  # Grafana\n  - job_name: 'grafana'\n    static_configs:\n      - targets: ['grafana-service:3000']\n    metrics_path: /metrics\n    scrape_interval: 30s"