[tool:pytest]
# Pytest configuration for EZBI Analytics

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    ml: Machine learning tests
    performance: Performance tests
    security: Security tests
    slow: Slow running tests
    manufacturing: Manufacturing-specific tests
    french: French compliance tests
    auth: Authentication tests
    api: API tests
    database: Database tests
    file_upload: File upload tests
    prediction: Prediction tests
    reporting: Reporting tests
    
# Test options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
    --asyncio-mode=auto

# Minimum Python version
minversion = 3.9

# Test output
console_output_style = progress
junit_family = xunit2

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::pytest.PytestUnraisableExceptionWarning

# Test timeout
timeout = 300
timeout_method = thread

# Asyncio configuration
asyncio_mode = auto

# Test collection
collect_ignore = [
    "setup.py",
    "conftest.py"
]

# Test environment
env =
    TESTING = 1
    DATABASE_URL = postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
    SECRET_KEY = test_secret_key_for_testing_only_never_use_in_production
    ENVIRONMENT = testing
    DEBUG = false