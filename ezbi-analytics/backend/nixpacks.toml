# Fresh nixpacks config to force cache clear
[providers]
python = "3.11"

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
FORCE_REBUILD = "true"

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "echo '🔄 CLEARING CACHE - Fresh install'",
  "pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir -r requirements-minimal.txt",
  "echo '✅ Installed packages:' && pip list | grep -E '(fastapi|uvicorn|psycopg2)'"
]

[phases.build]
cmds = [
  "echo '📁 Current directory:' && pwd",
  "echo '📂 All files in directory:' && ls -la",
  "echo '📄 Checking main.py exists:' && test -f main.py && echo '✅ main.py found' || echo '❌ main.py missing'",
  "echo '🔍 Python path:' && python -c 'import sys; print(sys.path)'",
  "echo '🐍 Testing main.py import:' && python -c 'import main; print(\"✅ main.py imports successfully\")' || echo '❌ main.py import failed'",
  "echo '🎯 Testing uvicorn import:' && python -c 'import uvicorn; print(\"✅ uvicorn available\")' || echo '❌ uvicorn missing'",
  "echo '🚀 Ready for deployment'"
]

[start]
cmd = "echo '🚀 Starting EZBI Analytics API' && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"