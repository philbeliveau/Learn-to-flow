[providers]
python = "3.11"

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["python311", "sqlite"]

[phases.install]
cmds = ["pip install -r requirements-minimal.txt"]

[phases.build]
cmds = ["mkdir -p data"]

[start]
cmd = "uvicorn simple_main:app --host 0.0.0.0 --port $PORT"