name: EZBI Analytics CI/CD Pipeline\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main, develop ]\n  workflow_dispatch:\n\nenv:\n  REGISTRY: ghcr.io\n  IMAGE_NAME: ${{ github.repository }}\n  NODE_VERSION: '18'\n  PYTHON_VERSION: '3.11'\n\njobs:\n  # Security and Code Quality\n  security-scan:\n    name: Security Scan\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - name: Run Trivy vulnerability scanner\n        uses: aquasecurity/trivy-action@master\n        with:\n          scan-type: 'fs'\n          scan-ref: '.'\n          format: 'sarif'\n          output: 'trivy-results.sarif'\n\n      - name: Upload Trivy scan results\n        uses: github/codeql-action/upload-sarif@v2\n        with:\n          sarif_file: 'trivy-results.sarif'\n\n      - name: Run Semgrep\n        uses: returntocorp/semgrep-action@v1\n        with:\n          config: >-\n            p/security-audit\n            p/secrets\n            p/python\n            p/javascript\n            p/typescript\n\n  # Backend Tests\n  backend-tests:\n    name: Backend Tests\n    runs-on: ubuntu-latest\n    services:\n      postgres:\n        image: postgres:15\n        env:\n          POSTGRES_PASSWORD: postgres\n          POSTGRES_DB: test_db\n        options: >-\n          --health-cmd pg_isready\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5\n        ports:\n          - 5432:5432\n      \n      redis:\n        image: redis:7\n        options: >-\n          --health-cmd \"redis-cli ping\"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5\n        ports:\n          - 6379:6379\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v4\n        with:\n          python-version: ${{ env.PYTHON_VERSION }}\n\n      - name: Cache pip dependencies\n        uses: actions/cache@v3\n        with:\n          path: ~/.cache/pip\n          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}\n          restore-keys: |\n            ${{ runner.os }}-pip-\n\n      - name: Install dependencies\n        run: |\n          cd backend\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n\n      - name: Run linting\n        run: |\n          cd backend\n          ruff check .\n          black --check .\n          mypy .\n\n      - name: Run tests\n        env:\n          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db\n          REDIS_URL: redis://localhost:6379/0\n          SECRET_KEY: test-secret-key\n          ENVIRONMENT: test\n        run: |\n          cd backend\n          pytest --cov=app --cov-report=xml --cov-report=html -v\n\n      - name: Upload coverage to Codecov\n        uses: codecov/codecov-action@v3\n        with:\n          file: ./backend/coverage.xml\n          flags: backend\n          name: backend-coverage\n\n  # ML Engine Tests\n  ml-engine-tests:\n    name: ML Engine Tests\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v4\n        with:\n          python-version: ${{ env.PYTHON_VERSION }}\n\n      - name: Cache pip dependencies\n        uses: actions/cache@v3\n        with:\n          path: ~/.cache/pip\n          key: ${{ runner.os }}-ml-pip-${{ hashFiles('**/requirements.txt') }}\n          restore-keys: |\n            ${{ runner.os }}-ml-pip-\n\n      - name: Install dependencies\n        run: |\n          cd ml-engine\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n\n      - name: Run ML tests\n        run: |\n          cd ml-engine\n          pytest --cov=. --cov-report=xml -v\n\n      - name: Upload ML coverage\n        uses: codecov/codecov-action@v3\n        with:\n          file: ./ml-engine/coverage.xml\n          flags: ml-engine\n          name: ml-engine-coverage\n\n  # Frontend Tests\n  frontend-tests:\n    name: Frontend Tests\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: ${{ env.NODE_VERSION }}\n          cache: 'npm'\n          cache-dependency-path: frontend/package-lock.json\n\n      - name: Install dependencies\n        run: |\n          cd frontend\n          npm ci\n\n      - name: Run linting\n        run: |\n          cd frontend\n          npm run lint\n\n      - name: Run type checking\n        run: |\n          cd frontend\n          npm run type-check\n\n      - name: Run tests\n        run: |\n          cd frontend\n          npm test -- --coverage --watchAll=false\n\n      - name: Upload frontend coverage\n        uses: codecov/codecov-action@v3\n        with:\n          file: ./frontend/coverage/lcov.info\n          flags: frontend\n          name: frontend-coverage\n\n  # Build and Push Docker Images\n  build-images:\n    name: Build Docker Images\n    runs-on: ubuntu-latest\n    needs: [security-scan, backend-tests, ml-engine-tests, frontend-tests]\n    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')\n    strategy:\n      matrix:\n        component: [backend, frontend, ml-engine]\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Log in to Container Registry\n        uses: docker/login-action@v3\n        with:\n          registry: ${{ env.REGISTRY }}\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n\n      - name: Extract metadata\n        id: meta\n        uses: docker/metadata-action@v5\n        with:\n          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}\n          tags: |\n            type=ref,event=branch\n            type=ref,event=pr\n            type=sha,prefix={{branch}}-\n            type=raw,value=latest,enable={{is_default_branch}}\n\n      - name: Set up Docker Buildx\n        uses: docker/setup-buildx-action@v3\n\n      - name: Build and push Docker image\n        uses: docker/build-push-action@v5\n        with:\n          context: ./${{ matrix.component }}\n          push: true\n          tags: ${{ steps.meta.outputs.tags }}\n          labels: ${{ steps.meta.outputs.labels }}\n          cache-from: type=gha\n          cache-to: type=gha,mode=max\n          target: production\n\n  # Deploy to Staging\n  deploy-staging:\n    name: Deploy to Staging\n    runs-on: ubuntu-latest\n    needs: build-images\n    if: github.ref == 'refs/heads/develop'\n    environment:\n      name: staging\n      url: https://staging.ezbi.example.com\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up kubectl\n        uses: azure/setup-kubectl@v3\n        with:\n          version: 'v1.28.0'\n\n      - name: Configure kubectl\n        run: |\n          echo \"${{ secrets.KUBE_CONFIG_STAGING }}\" | base64 -d > kubeconfig\n          export KUBECONFIG=kubeconfig\n\n      - name: Deploy to staging\n        env:\n          KUBECONFIG: kubeconfig\n        run: |\n          # Update image tags in Kubernetes manifests\n          sed -i \"s|image: ezbi/backend:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:develop|g\" deployment/kubernetes/backend.yaml\n          sed -i \"s|image: ezbi/frontend:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:develop|g\" deployment/kubernetes/frontend.yaml\n          sed -i \"s|image: ezbi/ml-engine:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ml-engine:develop|g\" deployment/kubernetes/ml-engine.yaml\n          \n          # Apply Kubernetes manifests\n          kubectl apply -f deployment/kubernetes/namespace.yaml\n          kubectl apply -f deployment/kubernetes/secrets.yaml\n          kubectl apply -f deployment/kubernetes/storage.yaml\n          kubectl apply -f deployment/kubernetes/database.yaml\n          kubectl apply -f deployment/kubernetes/backend.yaml\n          kubectl apply -f deployment/kubernetes/frontend.yaml\n          kubectl apply -f deployment/kubernetes/ml-engine.yaml\n          kubectl apply -f deployment/kubernetes/monitoring.yaml\n          kubectl apply -f deployment/kubernetes/ingress.yaml\n          \n          # Wait for rollout to complete\n          kubectl rollout status deployment/backend-deployment -n ezbi-analytics\n          kubectl rollout status deployment/frontend-deployment -n ezbi-analytics\n          kubectl rollout status deployment/ml-engine-deployment -n ezbi-analytics\n\n      - name: Run smoke tests\n        run: |\n          # Wait for services to be ready\n          sleep 60\n          \n          # Run basic health checks\n          curl -f https://staging-api.ezbi.example.com/health || exit 1\n          curl -f https://staging-ml.ezbi.example.com/health || exit 1\n          curl -f https://staging.ezbi.example.com || exit 1\n\n  # Deploy to Production\n  deploy-production:\n    name: Deploy to Production\n    runs-on: ubuntu-latest\n    needs: build-images\n    if: github.ref == 'refs/heads/main'\n    environment:\n      name: production\n      url: https://ezbi.example.com\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up kubectl\n        uses: azure/setup-kubectl@v3\n        with:\n          version: 'v1.28.0'\n\n      - name: Configure kubectl\n        run: |\n          echo \"${{ secrets.KUBE_CONFIG_PRODUCTION }}\" | base64 -d > kubeconfig\n          export KUBECONFIG=kubeconfig\n\n      - name: Blue-Green Deployment\n        env:\n          KUBECONFIG: kubeconfig\n        run: |\n          # Create blue-green deployment script\n          cat > blue-green-deploy.sh << 'EOF'\n          #!/bin/bash\n          set -e\n          \n          NAMESPACE=\"ezbi-analytics\"\n          CURRENT_COLOR=$(kubectl get service backend-service -n $NAMESPACE -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo \"blue\")\n          NEW_COLOR=\"green\"\n          if [ \"$CURRENT_COLOR\" = \"green\" ]; then\n            NEW_COLOR=\"blue\"\n          fi\n          \n          echo \"Current color: $CURRENT_COLOR, New color: $NEW_COLOR\"\n          \n          # Update image tags and color labels\n          sed -i \"s|image: ezbi/backend:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:main|g\" deployment/kubernetes/backend.yaml\n          sed -i \"s|image: ezbi/frontend:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:main|g\" deployment/kubernetes/frontend.yaml\n          sed -i \"s|image: ezbi/ml-engine:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ml-engine:main|g\" deployment/kubernetes/ml-engine.yaml\n          \n          # Add color labels to deployments\n          sed -i \"s|app: backend|app: backend\\n        color: $NEW_COLOR|g\" deployment/kubernetes/backend.yaml\n          sed -i \"s|app: frontend|app: frontend\\n        color: $NEW_COLOR|g\" deployment/kubernetes/frontend.yaml\n          sed -i \"s|app: ml-engine|app: ml-engine\\n        color: $NEW_COLOR|g\" deployment/kubernetes/ml-engine.yaml\n          \n          # Deploy new version\n          kubectl apply -f deployment/kubernetes/backend.yaml\n          kubectl apply -f deployment/kubernetes/frontend.yaml\n          kubectl apply -f deployment/kubernetes/ml-engine.yaml\n          \n          # Wait for rollout to complete\n          kubectl rollout status deployment/backend-deployment -n $NAMESPACE\n          kubectl rollout status deployment/frontend-deployment -n $NAMESPACE\n          kubectl rollout status deployment/ml-engine-deployment -n $NAMESPACE\n          \n          # Health check\n          echo \"Running health checks...\"\n          sleep 30\n          \n          # Check if new pods are healthy\n          kubectl get pods -n $NAMESPACE -l color=$NEW_COLOR\n          \n          # Switch traffic to new version\n          kubectl patch service backend-service -n $NAMESPACE -p '{\"spec\":{\"selector\":{\"color\":\"'$NEW_COLOR'\"}}}'  \n          kubectl patch service frontend-service -n $NAMESPACE -p '{\"spec\":{\"selector\":{\"color\":\"'$NEW_COLOR'\"}}}'  \n          kubectl patch service ml-engine-service -n $NAMESPACE -p '{\"spec\":{\"selector\":{\"color\":\"'$NEW_COLOR'\"}}}'\n          \n          echo \"Traffic switched to $NEW_COLOR\"\n          \n          # Clean up old version after successful deployment\n          sleep 60\n          kubectl delete deployment -n $NAMESPACE -l color=$CURRENT_COLOR --ignore-not-found=true\n          \n          echo \"Blue-green deployment completed successfully\"\n          EOF\n          \n          chmod +x blue-green-deploy.sh\n          ./blue-green-deploy.sh\n\n      - name: Run production smoke tests\n        run: |\n          # Wait for services to be ready\n          sleep 60\n          \n          # Run comprehensive health checks\n          curl -f https://api.ezbi.example.com/health || exit 1\n          curl -f https://ml.ezbi.example.com/health || exit 1\n          curl -f https://ezbi.example.com || exit 1\n          \n          # Run API tests\n          curl -f https://api.ezbi.example.com/docs || exit 1\n\n      - name: Notify deployment success\n        uses: 8398a7/action-slack@v3\n        with:\n          status: success\n          text: 'Production deployment completed successfully! 🚀'\n        env:\n          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}\n        if: success()\n\n      - name: Notify deployment failure\n        uses: 8398a7/action-slack@v3\n        with:\n          status: failure\n          text: 'Production deployment failed! 🚨'\n        env:\n          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}\n        if: failure()\n\n  # Performance Testing\n  performance-tests:\n    name: Performance Tests\n    runs-on: ubuntu-latest\n    needs: deploy-staging\n    if: github.ref == 'refs/heads/develop'\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Run K6 Load Tests\n        uses: grafana/k6-action@v0.3.0\n        with:\n          filename: scripts/performance-tests.js\n        env:\n          BASE_URL: https://staging.ezbi.example.com\n          API_URL: https://staging-api.ezbi.example.com\n\n      - name: Upload performance results\n        uses: actions/upload-artifact@v3\n        with:\n          name: performance-results\n          path: results.json\n\n  # Cleanup\n  cleanup:\n    name: Cleanup\n    runs-on: ubuntu-latest\n    needs: [deploy-staging, deploy-production]\n    if: always()\n    steps:\n      - name: Clean up Docker cache\n        run: |\n          docker system prune -f\n          docker volume prune -f\n\n      - name: Clean up workspace\n        run: |\n          rm -rf kubeconfig || true\n          rm -rf blue-green-deploy.sh || true"