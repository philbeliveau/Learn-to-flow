name: EZBI Analytics Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

env:
  TESTING: 1
  ENVIRONMENT: testing
  SECRET_KEY: test_secret_key_for_testing_only_never_use_in_production
  DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test

jobs:
  # Lint and Code Quality
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install ruff black mypy bandit safety
          pip install -r requirements.txt
      
      - name: Run Ruff linting
        run: |
          cd backend
          ruff check app/ --output-format=github
      
      - name: Run Black formatting check
        run: |
          cd backend
          black --check --diff app/
      
      - name: Run MyPy type checking
        run: |
          cd backend
          mypy app/ --ignore-missing-imports
      
      - name: Run Bandit security linting
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Run Safety dependency check
        run: |
          cd backend
          safety check --json --output safety-report.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/tests/test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Run unit tests
        run: |
          cd backend
          python tests/run_tests.py --suite unit
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: unit-tests
          name: unit-tests-${{ matrix.python-version }}

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('backend/requirements.txt', 'backend/tests/test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
      
      - name: Run database migrations
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
      
      - name: Run integration tests
        run: |
          cd backend
          python tests/run_tests.py --suite integration
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
          REDIS_URL: redis://localhost:6379/0
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: backend/test-results.xml

  # ML Model Tests
  ml-tests:
    name: ML Model Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml-engine/requirements.txt', 'backend/tests/test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml-engine/requirements.txt
          pip install -r backend/tests/test_requirements.txt
      
      - name: Run ML model tests
        run: |
          cd backend
          python tests/run_tests.py --suite ml
        timeout-minutes: 30
      
      - name: Upload ML test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ml-test-artifacts
          path: |
            backend/test_models/
            backend/ml-test-results.xml

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('backend/requirements.txt', 'backend/tests/test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-
      
      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd backend
          playwright install --with-deps chromium
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
        env:
          PGPASSWORD: password
      
      - name: Run database migrations
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
      
      - name: Start backend server
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
      
      - name: Start frontend server
        run: |
          cd frontend
          npm start &
          sleep 15
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      
      - name: Run E2E tests
        run: |
          cd backend
          python tests/run_tests.py --suite e2e
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
      
      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-artifacts
          path: |
            backend/test-results/
            backend/playwright-report/

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
        env:
          PGPASSWORD: password
      
      - name: Run performance tests
        run: |
          cd backend
          python tests/run_tests.py --suite performance
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
        timeout-minutes: 30
      
      - name: Upload performance reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-reports
          path: backend/reports/

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
        env:
          PGPASSWORD: password
      
      - name: Run security tests
        run: |
          cd backend
          python tests/run_tests.py --suite security
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
      
      - name: Run security audit
        run: |
          cd backend
          python tests/run_tests.py --audit
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-reports
          path: backend/reports/security/

  # Manufacturing Domain Tests
  manufacturing-tests:
    name: Manufacturing Domain Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
        env:
          PGPASSWORD: password
      
      - name: Run manufacturing tests
        run: |
          cd backend
          python tests/run_tests.py --suite manufacturing
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
      
      - name: Run French compliance tests
        run: |
          cd backend
          python tests/run_tests.py --suite french
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test

  # Test Summary and Reporting
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, ml-tests, e2e-tests, security-tests, manufacturing-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate test summary
        run: |
          echo "# EZBI Analytics Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality & Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ML Model Tests | ${{ needs.ml-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manufacturing Tests | ${{ needs.manufacturing-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports are available in the artifacts." >> $GITHUB_STEP_SUMMARY
      
      - name: Upload combined test reports
        uses: actions/upload-artifact@v3
        with:
          name: complete-test-reports
          path: |
            **/*-report.*
            **/*-results.*
            **/coverage.*
          retention-days: 30

  # Nightly Performance Tests (only on main branch)
  nightly-performance:
    name: Nightly Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ezbi_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
          pip install locust
      
      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d ezbi_analytics_test -c "SELECT 1;"
        env:
          PGPASSWORD: password
      
      - name: Run extended performance tests
        run: |
          cd backend
          # Run longer performance tests for nightly builds
          python tests/run_tests.py --suite performance
          # Additional load testing with Locust
          # locust -f tests/performance/load_test.py --headless -u 100 -r 10 -t 300s --host http://localhost:8000
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/ezbi_analytics_test
        timeout-minutes: 60
      
      - name: Upload nightly performance reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: nightly-performance-reports
          path: backend/reports/
          retention-days: 7