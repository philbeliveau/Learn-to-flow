<div class="p-4 min-w-full">
    <div class="relative">
      <div
        class="relative flex flex-col border border-white/10 rounded-xl bg-black"
      >
        <div class="overflow-y-auto">
          <textarea
            rows="3"
            style="overflow: hidden; outline: none"
            class="w-full px-4 py-3 resize-none bg-transparent border-none focus:outline-none focus-visible:ring-0 focus-visible:ring-offset-0 placeholder:text-white/50 align-top leading-normal min-h-[80px] text-white"
            placeholder="Ask me anything..."
          ></textarea>
        </div>
        <div class="h-14">
          <div
            class="absolute left-3 right-3 bottom-3 flex items-center justify-between"
          >
            <div class="flex items-center gap-2">
              <button
                class="p-2 text-white/50 hover:text-white transition-colors rounded-lg border border-white/10 hover:border-white/20"
                aria-label="Attach file"
                type="button"
              >
                <svg
                  class="w-4 h-4"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2"
                  stroke="currentColor"
                  fill="none"
                  viewBox="0 0 24 24"
                  height="16"
                  width="16"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
                  ></path>
                </svg>
              </button>
              <button
                class="p-2 text-white/50 hover:text-white transition-colors rounded-lg border border-white/10 hover:border-white/20"
                aria-label="Attach web link"
                type="button"
              >
                <svg
                  class="w-4 h-4 text-blue-500"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2"
                  stroke="currentColor"
                  fill="none"
                  viewBox="0 0 24 24"
                  height="16"
                  width="16"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle r="10" cy="12" cx="12"></circle>
                  <path
                    d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"
                  ></path>
                  <path d="M2 12h20"></path>
                </svg>
              </button>
              <button
                class="p-2 text-white/50 hover:text-white transition-colors rounded-lg border border-white/10 hover:border-white/20"
                aria-label="Attach Figma link"
                type="button"
              >
                <svg
                  class="w-4 h-4 text-pink-500"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2"
                  stroke="currentColor"
                  fill="none"
                  viewBox="0 0 24 24"
                  height="16"
                  width="16"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M5 5.5A3.5 3.5 0 0 1 8.5 2H12v7H8.5A3.5 3.5 0 0 1 5 5.5z"
                  ></path>
                  <path d="M12 2h3.5a3.5 3.5 0 1 1 0 7H12V2z"></path>
                  <path d="M12 12.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 1 1-7 0z"></path>
                  <path
                    d="M5 19.5A3.5 3.5 0 0 1 8.5 16H12v3.5a3.5 3.5 0 1 1-7 0z"
                  ></path>
                  <path
                    d="M5 12.5A3.5 3.5 0 0 1 8.5 9H12v7H8.5A3.5 3.5 0 0 1 5 12.5z"
                  ></path>
                </svg>
              </button>
            </div>
            <button
              class="p-2 transition-colors text-blue-500 hover:text-blue-600"
              aria-label="Send message"
              type="button"
            >
              <svg
                class="w-6 h-6"
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2"
                stroke="currentColor"
                fill="none"
                viewBox="0 0 24 24"
                height="24"
                width="24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle r="10" cy="12" cx="12"></circle>
                <path d="m16 12-4-4-4 4"></path>
                <path d="M12 16V8"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
